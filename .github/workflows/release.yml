# On tag push (v*): test, cross-compile every platform binary (one matrix
# job per GOOS/GOARCH so a broken target is visible on its own), build
# Debian packages for both Linux arches, build the web bundle, build an
# Android APK (WebView shell around that web bundle), then a tag-gated
# release job merges the artifacts into a GitHub Release (binaries + debs
# + APK + SHA256SUMS + mario-web.zip) and an omp-generated RELEASE_NOTES.md
# asset is attached. The web-dist artifact is picked
# up from this run by pages.yml (workflow_run), which deploys from a
# default-branch context because the github-pages environment's
# protection rules reject tag refs.
#
# Manual dispatch = test/build/web/apk only; the release job is
# tag-gated, so dispatches never publish anything.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Tag pushes twice / rerun races must not interleave artifact uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, mario]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      # Go comes from the runner image PATH (runner extraPackages); go.mod needs >=1.22
      - name: Check (fmtcheck + vet + tests)
        run: make check

  build:
    needs: test
    runs-on: [self-hosted, mario]
    timeout-minutes: 10
    strategy:
      # Try every target even if one fails: per-platform signal, and the
      # runner is single-threaded across jobs anyway, so no cost.
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      - name: Build
        run: make ${{ matrix.goos }}/${{ matrix.goarch }}

      # Deb is pure Go (tools/mkdeb) — no dpkg needed on the NixOS runner.
      - name: Build deb package
        if: matrix.goos == 'linux'
        run: make deb/${{ matrix.goarch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7
        with:
          name: mario-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/mario-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            dist/mario_*_${{ matrix.goarch }}.deb
          if-no-files-found: error

  web:
    needs: test
    runs-on: [self-hosted, mario]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      - name: Build web bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: make web

      # pages.yml fetches this artifact from the release run by name.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7
        with:
          name: web-dist
          path: dist/web

  # Android APK: the WASM build wrapped in a thin WebView shell
  # (packaging/android). The Android SDK + JDK come from the repo flake
  # (nix develop .#android) so the NixOS runner needs no provisioning;
  # the first build downloads the SDK zips, later ones substitute them
  # from the runner's caches.
  apk:
    needs: test
    runs-on: [self-hosted, mario]
    # Best-effort: an APK build failure (SDK/toolchain trouble on the
    # runner) must never gate the release or the Pages deploy — the same
    # policy that made AUR local-build only. The release steps below
    # tolerate a missing APK.
    continue-on-error: true
    # 40min: the first run materialises the Android SDK (auto-patchelf
    # over every SDK binary is slow); later runs reuse the store paths.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      - name: Build web bundle + APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: nix develop .#android -c make apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7
        with:
          name: mario-android
          path: dist/mario_*_android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, web, apk]
    runs-on: [self-hosted, mario]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # pattern mario-* merges every per-OS binary artifact AND the
      # mario-android APK artifact (its name matches the pattern).
      - name: Wipe workspace before artifact download
        run: rm -rf dist web-dist && mkdir dist web-dist
      - name: Gather binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: mario-*
          merge-multiple: true

      - name: Gather web bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web-dist

      # SHA256SUMS lists the five binaries, both debs, the Android APK
      # + the web zip; mario-web.zip is picked up by the dist/mario-*
      # glob below (do not list it twice). The debs are
      # mario_<ver>_<arch>.deb and the APK mario_<ver>_android.apk —
      # underscores, so they never collide with that glob.
      - name: Checksums + web zip
        run: |
          cd dist && sha256sum mario-linux-* mario-darwin-* mario-windows-* mario_*_*.deb > SHA256SUMS
          ls mario_*_android.apk >/dev/null 2>&1 && sha256sum mario_*_android.apk >> SHA256SUMS || echo no-apk-this-run
          cd ../web-dist && zip -qr ../dist/mario-web.zip .
          cd ../dist && sha256sum mario-web.zip >> SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asset list; the APK joins only when the best-effort apk job
          # produced one (set -- keeps this shellcheck-clean POSIX sh).
          set -- dist/mario-* dist/mario_*_*.deb dist/SHA256SUMS
          ls dist/mario_*_android.apk >/dev/null 2>&1 && set -- "$@" dist/mario_*_android.apk
          if gh release create "$GITHUB_REF_NAME" "$@" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
              --repo "$GITHUB_REPOSITORY"; then
            exit 0
          fi
          # Rerun of a completed run: the release already exists — refresh
          # its assets instead of dying on "already_exists".
          echo "release exists, uploading assets with --clobber"
          gh release upload "$GITHUB_REF_NAME" "$@" \
              --clobber --repo "$GITHUB_REPOSITORY"

  # Release notes generated by omp (oh-my-pi, the AI coding agent) from the
  # commit log between the previous tag and this one, attached to the
  # published release as a RELEASE_NOTES.md asset (clobbered on rerun).
  # Best-effort by design: pages.yml gates on this workflow's overall
  # conclusion, so a model/endpoint hiccup must never turn the run red —
  # same policy as the apk job. Needs omp in the runner image (nixos-incus
  # github-runner-mario extraPackages) and the ZHIPU_API_KEY repo secret
  # (flat-rate GLM coding plan key).
  notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: [self-hosted, mario]
    timeout-minutes: 10
    permissions:
      contents: write
    continue-on-error: true
    steps:
      # Full history + tags: the notes span previous tag .. this tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677268 # v5
        with:
          fetch-depth: 0

      - name: Generate release notes with omp
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          set -eu
          command -v omp >/dev/null 2>&1 || {
            echo "omp is not on the runner PATH — rebuild github-runner-mario with omp in extraPackages" >&2
            exit 1
          }
          [ -n "${ZHIPU_API_KEY:-}" ] || {
            echo "ZHIPU_API_KEY secret is not set on the repo" >&2
            exit 1
          }
          TAG="$GITHUB_REF_NAME"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          {
            cat <<EOF
          You are writing the release notes for a GitHub release of "mario" — a terminal (CLI) Mario-style platformer in Go with a browser WASM build, an Android APK, .deb packages, a UEFI-bootable image, and an online leaderboard on Supabase. Private repo, single developer, commit subjects are short lowercase imperatives.

          Release: $TAG (previous release: ${PREV:-none — first release})

          Commit log, oldest first (merge commits skipped):
          EOF
            git log --oneline --no-merges --reverse "$RANGE" | sed -n '1,300p'
            echo
            echo 'Diffstat (first 80 lines):'
            git diff --stat "$RANGE" | sed -n '1,80p'
            cat <<'EOF'

          Write the release notes document:
          - Begin with "# <TAG>" and a 1-2 sentence summary of the release theme.
          - Then sections "## Highlights", "## Added", "## Changed", "## Fixed", "## Packaging" (player-facing wording; omit any section with nothing in it).
          - One line per change, factual, derived ONLY from the commit log and diffstat above — never invent details.
          - If the log shows an engine version bump (EngineVersion), add a "## Note for players" bullet: older leaderboard replays may be re-verified or invalid.
          - Plain markdown only, max 40 lines total.
          Output ONLY the markdown document, nothing else.
          EOF
          } > notes-prompt.txt
          # Same invocation validated on biro: ~30s with glm-5.2, thinking off.
          omp -p --no-session --no-tools --no-rules --no-skills --no-extensions \
              --no-title --thinking off --model zhipu-coding-plan/glm-5.2 \
              --max-time 6m < notes-prompt.txt > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || { echo "omp produced empty release notes" >&2; exit 1; }
          echo "--- RELEASE_NOTES.md (first 10 lines) ---"
          sed -n '1,10p' RELEASE_NOTES.md

      - name: Attach notes to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" RELEASE_NOTES.md \
              --clobber --repo "$GITHUB_REPOSITORY"

  # packaging/aur is NOT published anywhere: the PKGBUILD is kept for
  # local builds only (makepkg -p packaging/aur/PKGBUILD on a machine
  # with a GitHub ssh key that can clone this private repo).
