# On tag push (v*): test, cross-compile every platform binary, publish a
# GitHub Release with binaries + SHA256SUMS + a web zip, and upload the
# static web build as an artifact. Deploying it to Pages happens in
# pages.yml (workflow_run), which runs from the default branch because
# the github-pages environment's protection rules reject tag refs.
name: release

on:
  push:
    tags: ['v*']
  # Manual dispatch = build/test only; the release-create step is tag-gated,
  # so dispatches never publish anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, mario]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      # Go comes from the runner image PATH (runner extraPackages); go.mod needs >=1.22
      - name: Test
        run: make test

      - name: Build all platform binaries
        run: make release

      - name: Build web bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: make web

      - name: Zip web bundle
        run: |
          cd dist/web && zip -r ../mario-web.zip .
          cd .. && sha256sum mario-web.zip >> SHA256SUMS

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mario-* dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7
        with:
          name: web-dist
          path: dist/web
