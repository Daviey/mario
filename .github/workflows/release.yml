# On tag push (v*): test, cross-compile every platform binary, publish a
# GitHub Release with binaries + SHA256SUMS + a web zip, and upload the
# static web build as an artifact. Deploying it to Pages happens in
# pages.yml (workflow_run), which runs from the default branch because
# the github-pages environment's protection rules reject tag refs.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: make test

      - name: Build all platform binaries
        run: make release

      - name: Build web bundle
        run: make web

      - name: Zip web bundle
        run: cd dist/web && zip -r ../mario-web.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mario-* dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/web
