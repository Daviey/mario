# Deploy the web build to GitHub Pages after a release run completes.
# Runs from the default branch (workflow_run context) because the
# github-pages environment's deployment protection rules reject tag refs.
# The site arrives as a plain artifact (auto-extracted to web-dist/) and
# is re-packaged as a pages artifact here, since deploy-pages only sees
# artifacts from its own run.
name: pages

on:
  workflow_run:
    workflows: ['release']
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web-dist

      - id: deployment
        uses: actions/deploy-pages@v5
