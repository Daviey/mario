# Deploy the web build to GitHub Pages after a release run completes.
# Runs from the default branch (workflow_run context) because the
# github-pages environment's deployment protection rules reject tag refs.
# deploy-pages only sees artifacts from its own run, so the release run's
# artifact is downloaded and re-uploaded here before deploying.
name: pages

on:
  workflow_run:
    workflows: ['release']
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Unpack site bundle
        run: |
          mkdir site
          tar -xf github-pages/artifact.tar -C site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
