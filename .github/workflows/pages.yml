# Deploy the web build to GitHub Pages after a release run completes.
# Runs from the default branch (workflow_run context) because the
# github-pages environment's deployment protection rules reject tag refs.
# The site is fetched from the release run's web-dist artifact explicitly
# (deterministic layout), then re-packaged as a pages artifact, since
# deploy-pages only sees artifacts from its own run.
name: pages

on:
  workflow_run:
    workflows: ['release']
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch site artifact from release run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          aid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.name == "web-dist") | .id' | head -n 1)
          [ -n "$aid" ] || { echo "web-dist artifact not found in run $SOURCE_RUN" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > web-dist.zip
          mkdir web-dist
          unzip -q web-dist.zip -d web-dist

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v5
        with:
          path: web-dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v5
