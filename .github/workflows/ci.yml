# Pre-tag gate: everything a release run does except publishing. Catches
# fmt/vet/test regressions, broken cross-targets, and GOOS=js breakage on
# main and PRs before a tag is cut. Runs on the self-hosted runner, so
# there are no metered Actions minutes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, mario]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      - name: Format + vet + tests
        run: make check
      # No race step: the runner image has no C toolchain and the race
      # detector requires cgo — `make race` stays a local gate.
      - name: Native build
        run: make build

      # The 17-target release matrix + AppImage smoke run on main pushes
      # only: PRs get fmt/vet/test + a native build + the GOOS=js
      # compile check (the flakiest surface), which covers ordinary
      # regressions in a fraction of the time on the single serial
      # runner. Required-status checks key off the job id (check), which
      # is unchanged.
      - name: Cross-compile all release targets
        if: ${{ github.event_name != 'pull_request' }}
        run: make release

      # GOOS=js compile check (artifact discarded); skips if repo vars
      # were never set up.
      - name: Web build compile-check
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: make web

      # Regression guard for the flakiest build surface: the appimage job
      # needs CAP_SYS_ADMIN on the runner unit (see AGENTS.md) and `file`
      # inside the appimage-run FHS env. Catches both classes on main
      # instead of at tag time.
      - name: AppImage build + smoke
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          make appimage VERSION=ci
          nix shell nixpkgs#appimage-run -c appimage-run dist/mario_ci_amd64.AppImage -ui-preview board | grep -q LEADERBOARD
