name: verify-scores

# Replay-verifies pending leaderboard submissions: every score carries the
# run's input log; the deterministic engine must reproduce the exact score.
# Keeps survivors, deletes the rest. The service key lives in the
# SUPABASE_SERVICE_KEY secret (never in binaries or the client).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-scores
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, mario]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
      - name: Verify pending scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: CGO_ENABLED=0 go run ./cmd/mario -verify-pending
