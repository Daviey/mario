# Auto-deploy the WASM web build to https://mario.baby (the mario-vps
# NixOS box, reached over the private network by the self-hosted runner).
# All connection specifics live in repo secrets:
#   MARIO_WEB_DEPLOY_KEY       ed25519 private key (mario-deploy user)
#   MARIO_DEPLOY_HOST          private network address of the VPS
#   MARIO_DEPLOY_USER          deploy username
#   MARIO_DEPLOY_KNOWN_HOSTS   pinned hostkey line(s)
# The runner container has no rsync — tar over ssh into a staging
# release dir, then cut over with a single rename (see the Deploy step).
name: web-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, mario]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        # Tags matter: make web stamps the wasm + SW cache with
        # `git describe --tags` — a shallow clone degrades the version
        # to a bare hash ("mario-a5e5ec2") instead of "v0.7.0".
        with:
          fetch-depth: 0

      # Vars missing → make web embeds empty board credentials and the
      # deployed site would silently lose its leaderboard. Fail loudly.
      - name: Require board credentials
        if: ${{ vars.SUPABASE_URL == '' || vars.SUPABASE_KEY == '' }}
        run: |
          echo "repo vars SUPABASE_URL / SUPABASE_KEY are not set" >&2
          exit 1

      - name: Build web bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: make web

      - name: Deploy
        env:
          KEY: ${{ secrets.MARIO_WEB_DEPLOY_KEY }}
          HOST: ${{ secrets.MARIO_DEPLOY_HOST }}
          USER: ${{ secrets.MARIO_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.MARIO_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "deploy secrets missing (KEY/HOST/USER/KNOWN_HOSTS)" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/mario_web_deploy"
          known="$RUNNER_TEMP/mario_known_hosts"
          printf '%s\n' "$KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"
          mssh() {
            ssh -i "$key" -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes -o ConnectTimeout=15 "$USER@$HOST" "$@"
          }

          # Visible freshness marker on the live site.
          echo "$GITHUB_SHA $(date -u +%FT%TZ)" > dist/web/deploy.txt

          # Atomic cutover, safe under cancel-in-progress: the live
          # /var/lib/mario-web/content is a symlink to releases/<run>,
          # so every deploy first extracts + verifies a private staging
          # release and only then flips the symlink with one mv -T
          # rename(2). No point in this sequence — cancellation included
          # — can leave mario.baby without a content dir; the previous
          # release stays in releases/ as an instant rollback target.
          rel="releases/$(printf '%s' "$GITHUB_SHA" | cut -c1-12)-$(date -u +%Y%m%dT%H%M%S)-r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"

          # Stage: extract the tar into the per-run release dir. set -e
          # on both ends makes a failed or truncated extract fail this
          # step before anything touches the live path.
          tar -C dist/web -cf - . | mssh "set -e
            cd /var/lib/mario-web && rm -rf '$rel' && mkdir -p '$rel' && tar -C '$rel' -xf -"

          # The runner builds under umask 077, so the tar carries 0600
          # files — nginx would 403 the whole site. Normalize, then
          # verify the payload BEFORE swapping: a broken build must
          # never become the live release.
          mssh "set -e
            cd /var/lib/mario-web/'$rel' &&
            find . -type d -exec chmod 755 {} + &&
            find . -type f -exec chmod 644 {} + &&
            test -s mario.wasm && test -s index.html && echo STAGED-OK"

          # Swap: migrate the pre-symlink real-dir layout once, sweep
          # the old layout's scratch dirs, then cut over with a single
          # rename. Everything left of the rename is staged off to the
          # side; everything after it is cleanup. Rollback by hand with
          # the same two commands pointing at an older releases/ dir:
          #   ln -sfn releases/<old> .rollback && mv -T .rollback content
          mssh "set -e
            cd /var/lib/mario-web
            if [ -d content ] && [ ! -L content ]; then
              mv content releases/legacy-\$(date -u +%Y%m%dT%H%M%S)
            fi
            ln -sfn '$rel' .content.staging
            mv -T .content.staging content
            live=\$(readlink content)
            ls -1dt releases/* | grep -v -F \"\$live\" | tail -n +4 | xargs -r rm -rf
            echo SWAPPED"
          mssh 'test -s /var/lib/mario-web/content/mario.wasm && test -s /var/lib/mario-web/content/index.html && echo CONTENT-OK'
