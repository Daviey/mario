<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPER CLI MARIO</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0e1a;
    display: flex; flex-direction: column;
    overflow: hidden;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  #bar {
    flex: 0 0 auto;
    padding: 6px 16px;
    background: #0a1c6e; color: #fff;
    font-weight: 700; letter-spacing: 2px;
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid #e4221b;
  }
  #bar .dim { font-weight: 400; letter-spacing: 0; color: #9fb6d9; font-size: 12px; }
  #stage {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: text;
  }
  #game { image-rendering: pixelated; }
  #note {
    flex: 0 0 auto;
    padding: 4px 16px; font-size: 12px; color: #6d7a99;
    background: #071330; text-align: center;
  }
  #note a { color: #9fb6d9; }
  /* ---- loading screen: mario.wasm is a few MB; show honest progress ---- */
  #stage { position: relative; }
  #loader {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px;
    background: #0b0e1a;
    transition: opacity .45s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .title {
    margin: 0 0 6px; font-size: 21px; font-weight: 700;
    letter-spacing: 7px; color: #f8d878;
    text-shadow: 3px 3px 0 #e4221b, 6px 6px 0 #04060f;
  }
  .trackwrap { position: relative; width: min(420px, 78vw); padding-top: 34px; }
  .track {
    position: relative; height: 26px; overflow: hidden;
    border: 3px solid #04060f; background-color: #111a3d;
    box-shadow: inset 0 0 0 2px #1d2c60;
  }
  .track::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, #0a1129 0 2px, transparent 2px 27px),
      linear-gradient(transparent 0 11px, #0a1129 11px 15px, transparent 15px);
  }
  .fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background-color: #c2571f;
    background-image:
      repeating-linear-gradient(90deg, rgba(4,6,15,.85) 0 2px, transparent 2px 27px),
      linear-gradient(transparent 0 11px, rgba(4,6,15,.85) 11px 15px, transparent 15px);
    box-shadow: inset 0 3px 0 #e8a33d;
  }
  .qb {
    position: absolute; top: 0; left: 0%;
    width: 22px; height: 22px; margin-left: -11px;
    background: #e39d25; border: 3px solid #04060f;
    box-shadow: inset 0 3px 0 #f8d878, inset 0 -3px 0 #a05a10;
    font: 700 13px/17px ui-monospace, Menlo, monospace;
    color: #04060f; text-align: center; user-select: none;
    animation: bump 1.5s ease-in-out infinite;
  }
  .qb::after { content: "?"; }
  @keyframes bump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .meta { display: flex; gap: 16px; align-items: baseline; font-size: 13px; color: #9fb6d9; }
  .meta .pct { min-width: 4ch; text-align: right; color: #fff; font-weight: 700; }
  .phase::after { content: "_"; animation: blink 1.1s steps(1) infinite; }
  .phase.err::after { content: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .qb { animation: none; } }
</style>
</head>
<body>
<div id="bar">
  <span>SUPER CLI MARIO</span>
  <span class="dim">a/d move · w/space jump · x run · p pause · q quit</span>
</div>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="loader" role="status">
    <div class="title">SUPER CLI MARIO</div>
    <div class="trackwrap">
      <div class="qb"></div>
      <div class="track"><div class="fill"></div></div>
    </div>
    <div class="meta" aria-live="polite">
      <span class="phase" id="phase">downloading</span>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
</div>
<div id="note">click the game to focus · <a href="#" onclick="location.reload(); return false">restart</a></div>

<!-- All asset paths are RELATIVE so the site works under a GitHub Pages
     sub-path (user.github.io/repo/). -->
<script src="./wasm_exec.js"></script>
<script>
(async () => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let imgData = null;
  // Loading screen: honest progress from the wasm download; the "?"
  // block rides the leading edge of the brick bar. Fades out on the
  // first painted frame — the moment the game is actually playable.
  const loader = document.getElementById('loader');
  const fillEl = loader.querySelector('.fill');
  const qbEl = loader.querySelector('.qb');
  const pctEl = document.getElementById('pct');
  const phaseEl = document.getElementById('phase');
  const MB = 1048576;
  const fmt = (n) => (n / MB).toFixed(1) + ' MB';
  const setProgress = (p, label) => {
    p = Math.max(0, Math.min(100, p));
    fillEl.style.width = p + '%';
    qbEl.style.left = p + '%';
    pctEl.textContent = Math.floor(p) + '%';
    if (label) phaseEl.textContent = label;
  };
  let loaderDone = false;
  const loaderReady = () => {
    if (loaderDone) return;
    loaderDone = true;
    setProgress(100, 'ready');
    loader.classList.add('done');
    setTimeout(() => loader.remove(), 600);
  };

  // The game pushes raw RGB pixels; paint them straight into the canvas.
  // object-fit: contain + pixelated keeps square pixels, uniform scale,
  // and fills the window (letterbox only if the aspect differs).
  window.marioFrame = (w, h, rgb) => {
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      imgData = ctx.createImageData(w, h);
    }
    const d = imgData.data;
    for (let i = 0, j = 0; i < d.length; i += 4, j += 3) {
      d[i] = rgb[j]; d[i+1] = rgb[j+1]; d[i+2] = rgb[j+2]; d[i+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    loaderReady(); // first painted frame = game is up
  };

  // Integer uniform scaling, like every polished pixel game: pick the
  // largest integer k where the game's max height fits, then size the
  // viewport so the scaled frame fills the width. Every world pixel is
  // exactly k device pixels — perfectly uniform, no banding possible.
  const PIX = 4, HUD = 8, STATUS = 7, MAXW_T = 60, MAXH_T = 15, MINH_T = 4;
  const sizeViewport = () => {
    const dpr = window.devicePixelRatio || 1;
    const availW = Math.floor(document.getElementById('stage').clientWidth * dpr);
    const availH = Math.floor(document.getElementById('stage').clientHeight * dpr);
    // Tiles of vertical view the window can show at scale 1.
    let tilesH = Math.max(MINH_T, Math.min(MAXH_T, Math.floor((availH - HUD - STATUS) / PIX)));
    let k = Math.max(1, Math.floor(availH / (HUD + tilesH * PIX + STATUS)));
    // If width forces fewer tiles at this scale, shrink view before scale.
    while (k > 1 && Math.floor(availW / (k * PIX)) < 16) k--;
    const tilesW = Math.max(16, Math.min(MAXW_T, Math.floor(availW / (k * PIX))));
    const pxW = tilesW * PIX, pxH = HUD + tilesH * PIX + STATUS;
    window.marioSize(pxW, pxH);
    canvas.style.width = (pxW * k / dpr) + 'px';
    canvas.style.height = (pxH * k / dpr) + 'px';
  };

  // Keyboard -> terminal-style sequences the game's input mapper already
  // parses. Press on keydown, kitty-style release on keyup: instant key
  // release, crisp controls.
  const PRESS = {
    ArrowLeft: '\x1b[1;1:1D', ArrowRight: '\x1b[1;1:1C',
    ArrowUp: '\x1b[1;1:1A', ArrowDown: '\x1b[1;1:1B',
  };
  const RELEASE = {
    ArrowLeft: '\x1b[1;1:3D', ArrowRight: '\x1b[1;1:3C',
    ArrowUp: '\x1b[1;1:3A', ArrowDown: '\x1b[1;1:3B',
  };
  const release = (code, key) =>
    RELEASE[code] || '\x1b[' + key.charCodeAt(0) + ';1:3u';
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'c') { window.marioFeed('\x03'); e.preventDefault(); return; }
    if (e.repeat) return; // the mapper decays held keys; repeats unneeded
    const seq = PRESS[e.code]
      || (e.key.length === 1 ? e.key : null)
      || (e.key === 'Enter' ? '\r' : null)
      || (e.key === 'Escape' ? '\x1b' : null);
    if (seq) { window.marioFeed(seq); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key.length === 1) window.marioFeed(release(e.code, e.key));
    else if (RELEASE[e.code]) window.marioFeed(RELEASE[e.code]);
  });

  // Start the game module; main() runs its own 60 Hz loop. mario.wasm is
  // a few MB, so fetch it manually for real byte progress, then
  // instantiate from the buffer.
  try {
    const res = await fetch('./mario.wasm');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let bytes;
    if (res.body) {
      const total = +res.headers.get('Content-Length') || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        // Bar tracks the true download fraction; later phases are
        // labels only, so the numbers never contradict each other.
        // If the server hides the length, creep toward done instead.
        const frac = total ? Math.min(1, got / total) : got / (got + 1.5 * MB);
        setProgress(frac * 100,
          'downloading ' + fmt(got) + (total ? ' / ' + fmt(total) : ''));
      }
      bytes = new Uint8Array(got);
      let off = 0;
      for (const c of chunks) { bytes.set(c, off); off += c.length; }
    } else {
      bytes = await res.arrayBuffer();
    }
    setProgress(100, 'compiling');
    const go = new Go();
    const { instance } = await WebAssembly.instantiate(bytes, go.importObject);
    setProgress(100, 'starting');
    go.run(instance);
  } catch (e) {
    phaseEl.classList.add('err');
    phaseEl.style.color = '#ff7b72';
    phaseEl.textContent = 'failed to load mario.wasm: ' + e +
      ' — serve over http(s), not file://';
    return;
  }
  sizeViewport();
  window.addEventListener('resize', () => setTimeout(sizeViewport, 100));
  document.body.addEventListener('click', () => window.focus());
})();
</script>
</body>
</html>
